name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc + static musl), x86_64 and aarch64 (native arm runners)
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,    musl: false }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,   musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   musl: false }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,  musl: true }
          # macOS
          - { os: macos-latest,     target: aarch64-apple-darwin,        musl: false }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,         musl: false }
          # Windows (controller over ssh; no local `sh` connection)
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,      musl: false }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,     musl: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: Install musl tooling
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=ransible-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p dist/$name && cp target/${{ matrix.target }}/release/ransible README.md COMPATIBILITY.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name && rm -rf dist/$name
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ransible-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ransible.exe, README.md, COMPATIBILITY.md dist/$name/
          Compress-Archive -Path dist/$name -DestinationPath dist/$name.zip
          Remove-Item -Recurse dist/$name
      - uses: actions/upload-artifact@v4
        with:
          name: ransible-${{ matrix.target }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: ransible-*, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*" }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
