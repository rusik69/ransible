- name: apt update
  apt: update_cache=yes
  become: true
- name: install packages
  package:
    name: "{{ packages }}"
    state: present
  become: true
- name: app group
  group: name={{ app_user }} state=present
  become: true
- name: app user
  user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    shell: /bin/bash
    create_home: yes
  become: true
- name: app dir
  file: path={{ app_dir }} state=directory owner={{ app_user }} group={{ app_user }} mode=0750
  become: true
