[package]
name = "ransible"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1.0.105"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4"
ctr = "0.9"
hex = "0.4"
hmac = "0.12"
jmespath = "0.3"
md-5 = "0.10"
minijinja = { version = "3.1.0", features = ["json", "loop_controls", "preserve_order", "serde", "unicode"] }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"] }
pbkdf2 = "0.12"
rand = "0.8"
regex = "1.13.2"
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha1 = "0.10"
sha2 = "0.10"
