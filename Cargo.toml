[package]
name = "ransible"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1.0.105"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive", "env"] }
clap_complete = "4"
ctr = "0.9"
futures-util = { version = "0.3.34", optional = true }
hex = "0.4"
hmac = "0.13"
indexmap = "2"
jmespath = "0.3"
md-5 = "0.10"
minijinja = { version = "3.1.0", features = ["json", "loop_controls", "preserve_order", "serde", "unicode"] }
minijinja-contrib = { version = "3.1.0", features = ["html_entities", "pycompat", "rand", "wordcount", "wordwrap"] }
pbkdf2 = "0.12"
rand = "0.8"
regex = "1.13.2"
rpassword = "7"
rusqlite = { version = "0.43.0", features = ["bundled"], optional = true }
rust-embed = { version = "8.14.0", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs", "signal"], optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }

[features]
default = ["server"]
# AWX-style web UI + REST API (`ransible serve`). Build with --no-default-features for a lean CLI-only binary.
server = ["dep:axum", "dep:tokio", "dep:rusqlite", "dep:rust-embed", "dep:tokio-stream", "dep:futures-util", "dep:tokio-rustls", "dep:rustls"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
